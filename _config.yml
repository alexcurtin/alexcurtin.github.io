resume_header_intro: "<p>Engineering leader with 12+ years building enterprise-scale, customer-centric infrastructure platforms known for their reliability, scalability and performance. Currently running Unity's platform for AI, including LLM routing infrastructure (LiteLLM) on Tessen, Unity's internal kubernetes platform serving 170+ teams, 1,200+ workloads, and ~30M production ingress requests/day across GCP, AWS, and Azure. <br><br>
Hands-on leader with extensive experience managing engineering managers, growing, mentoring and fostering high performing, motivated and globally distributed teams. Passionate about partnering with leadership on capacity, reliability, and cost management, defining a clear vision that aligns with business goals, and having a strong bias for action.</p>"

